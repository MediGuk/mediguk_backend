# Import environment variables from .env file
spring.config.import=optional:file:.env

# server.port=8080

# Define el perfil actual: 'dev' para programar, 'prod' para la web real
spring.profiles.active=dev

# Application Name (Optional, can also come from env)
spring.application.name=${APP_NAME:mediguk_backend}

# Database Configuration using Environment Variables
spring.datasource.url=jdbc:${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# CORS allowed
app.security.cors.allowed-origin=${FRONTEND_URL}

# Cookie Security
app.security.cookie.secure=${AUTH_COOKIE_SECURE}
app.security.cookie.samesite=${AUTH_COOKIE_SAMESITE}

# Gemini API KEY
app.ai.gemini.api-key=${GEMINI_API_KEY}

# Expiration of jwt (1h)
mediguk.jwt.expiration=3600000

# JWT private key
app.security.jwt.private-key=${JWT_PRIVATE_KEY}

# JWT public key
app.security.jwt.public-key=${JWT_PUBLIC_KEY}

# Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}


