# Usa H2 en memoria (mem) y ponle un nombre a la DB (testdb)
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;NOT_FIXED_EDITION=TRUE
spring.datasource.driverClassName=org.hibernate.dialect.H2Dialect
spring.datasource.username=sa
spring.datasource.password=

# Deja que Hibernate cree las tablas automáticamente según tus @Entity
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true